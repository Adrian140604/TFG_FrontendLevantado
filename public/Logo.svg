<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Sombra exterior -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo circular verde oscuro -->
  <circle cx="40" cy="40" r="39" fill="#1e4d2b" filter="url(#shadow)"/>

  <!-- Anillo exterior dorado -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="#b8943f" stroke-width="1.8"/>
  <!-- Anillo interior dorado (doble borde elegante) -->
  <circle cx="40" cy="40" r="34.5" fill="none" stroke="#b8943f" stroke-width="0.7" stroke-dasharray="2.5,2"/>

  <!-- ══ LIBRO ABIERTO ══ -->

  <!-- Página izquierda (marfil) -->
  <path d="M40 19
           C36 19 26 22 17 27
           L17 54
           C26 49 36 46 40 48
           Z"
        fill="#f5f2eb" stroke="#d4c9b8" stroke-width="0.5"/>

  <!-- Página derecha (marfil cálido) -->
  <path d="M40 19
           C44 19 54 22 63 27
           L63 54
           C54 49 44 46 40 48
           Z"
        fill="#ede9e0" stroke="#d4c9b8" stroke-width="0.5"/>

  <!-- Lomo del libro (dorado) -->
  <path d="M40 19 L40 48" stroke="#b8943f" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Líneas de texto — página izquierda -->
  <line x1="22" y1="32" x2="37" y2="29.5" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <line x1="22" y1="37" x2="37" y2="34.5" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <line x1="22" y1="42" x2="37" y2="39.5" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
  <line x1="22" y1="47" x2="34" y2="44.5" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.40"/>

  <!-- Líneas de texto — página derecha -->
  <line x1="43" y1="29.5" x2="58" y2="32" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  <line x1="43" y1="34.5" x2="58" y2="37" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  <line x1="43" y1="39.5" x2="58" y2="42" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  <line x1="43" y1="44.5" x2="55" y2="47" stroke="#6b6560" stroke-width="1.3" stroke-linecap="round" opacity="0.30"/>

  <!-- Ornamento superior: pequeño rombo dorado -->
  <polygon points="40,12  42.2,15  40,18  37.8,15"
           fill="#b8943f" opacity="0.9"/>

  <!-- Texto "BE" en la parte inferior -->
  <text x="40" y="68"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="8.5"
        font-weight="bold"
        fill="#d4af5c"
        letter-spacing="3">BE</text>

  <!-- Pequeña línea decorativa bajo el texto -->
  <line x1="33" y1="70.5" x2="47" y2="70.5" stroke="#b8943f" stroke-width="0.8" opacity="0.7"/>
</svg>
